name: HKTA Notifier

on:
  schedule:
    # Every 30 minutes. GitHub Actions cron uses UTC, but */30 is timezone-independent.
    # Note: GitHub may delay scheduled runs by 5–15 min during peak load — this is normal.
    - cron: "*/30 * * * *"
  workflow_dispatch:  # also let you run it manually from the Actions tab

# Required so the job can commit seen.json back to the repo.
permissions:
  contents: write

# Prevent overlapping runs if a previous one is still going.
concurrency:
  group: hkta-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Opt into Node.js 24 early to silence the Node 20 deprecation warning.
      # Safe to remove this line once GitHub makes Node 24 the default.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run notifier
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL:           ${{ secrets.TO_EMAIL }}
          MIN_FEE:            ${{ vars.MIN_FEE || '350' }}
        run: python hkta_notifier.py

      - name: Commit updated seen.json
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "hkta-notifier-bot"
            git config user.email "hkta-notifier-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "Update seen.json [skip ci]"
            git push
          else
            echo "No changes to seen.json."
          fi
